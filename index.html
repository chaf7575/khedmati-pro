<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خدمتي برو | اعرض منتجاتك</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#222}
header{background:#123b56;color:white;text-align:center;padding:30px 15px}
header h1{margin:0 0 10px;font-size:32px}
header p{margin:0;line-height:1.8}
main{max-width:850px;margin:25px auto;padding:15px}
.card{background:white;padding:22px;border-radius:14px;margin-bottom:18px;box-shadow:0 3px 12px #0000000c}
h2{color:#123b56;margin-top:0}
input,textarea,button{width:100%;padding:13px;margin:7px 0;border-radius:8px;font-size:16px}
input,textarea{border:1px solid #ccd3da}
button{background:#087f5b;color:white;border:0;cursor:pointer;font-weight:bold}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.product{border:1px solid #e3e7eb;border-radius:10px;padding:14px}
.product img{width:100%;max-height:200px;object-fit:contain}
.price{color:#087f5b;font-weight:bold;font-size:20px}
footer{text-align:center;padding:20px;color:#666}
</style>
</head>
<body>
<header>
<h1>خدمتي برو</h1>
<p>اعرض منتجاتك بسهولة، وشارك رابط متجرك مع زبائنك</p>
</header>
<main>
<section class="card">
<h2>أضف منتجك</h2>
<form id="productForm">
<input id="name" placeholder="اسم المنتج" required>
<input id="price" type="number" min="0" placeholder="السعر بالدينار الجزائري" required>
<input id="phone" type="tel" placeholder="رقم واتساب للتواصل" required>
<input id="photo" type="url" placeholder="رابط صورة المنتج (اختياري)">
<textarea id="description" placeholder="وصف المنتج"></textarea>
<button type="submit">عرض المنتج</button>
</form>
</section>
<section class="card">
<h2>المنتجات المعروضة</h2>
<div id="products" class="products"></div>
<p id="empty">لم تتم إضافة منتجات بعد.</p>
</section>
</main>
<footer>خدمتي برو © 2026</footer>
<script>
const form=document.getElementById('productForm');
const list=document.getElementById('products');
const empty=document.getElementById('empty');
form.addEventListener('submit',function(e){
e.preventDefault();
const name=document.getElementById('name').value.trim();
const price=document.getElementById('price').value;
const phone=document.getElementById('phone').value.trim();
const photo=document.getElementById('photo').value.trim();
const description=document.getElementById('description').value.trim();
const card=document.createElement('article');
card.className='product';
if(photo){
const img=document.createElement('img');
img.src=photo;
img.alt=name;
card.appendChild(img);
}
const title=document.createElement('h3');
title.textContent=name;
card.appendChild(title);
const p=document.createElement('p');
p.className='price';
p.textContent=Number(price).toLocaleString('fr-FR')+' دج';
card.appendChild(p);
const desc=document.createElement('p');
desc.textContent=description;
card.appendChild(desc);
const link=document.createElement('a');
link.href='https://wa.me/'+phone.replace(/\D/g,'')+'?text='+encodeURIComponent('السلام عليكم، أريد الاستفسار عن: '+name);
link.target='_blank';
link.rel='noopener';
link.textContent='اطلب عبر واتساب';
link.style.cssText='display:block;text-align:center;background:#087f5b;color:white;padding:12px;border-radius:8px;text-decoration:none';
card.appendChild(link);
list.prepend(card);
empty.style.display='none';
form.reset();
});
</script>
</body>
</html>
